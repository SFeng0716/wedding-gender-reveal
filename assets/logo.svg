<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Wedding Gender Reveal</title>
  <defs>
    <radialGradient id="ivory" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f1e5d0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e7bd"/>
      <stop offset=".35" stop-color="#d6b26a"/>
      <stop offset=".6" stop-color="#c6a15b"/>
      <stop offset="1" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c88a"/>
      <stop offset=".5" stop-color="#b8913f"/>
      <stop offset="1" stop-color="#8a682b"/>
    </linearGradient>
    <linearGradient id="boy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e8f8"/>
      <stop offset=".5" stop-color="#a9c8ea"/>
      <stop offset="1" stop-color="#7fa8d8"/>
    </linearGradient>
    <linearGradient id="girl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde3ea"/>
      <stop offset=".5" stop-color="#f5bccb"/>
      <stop offset="1" stop-color="#ec98b0"/>
    </linearGradient>
  </defs>

  <!-- ivory tile with a gold hairline frame -->
  <rect width="512" height="512" rx="112" fill="url(#ivory)"/>
  <rect x="26" y="26" width="460" height="460" rx="90" fill="none" stroke="url(#goldStroke)" stroke-width="5"/>

  <!-- the 3x3 board: 4 blue, 4 pink, no line complete — the golden centre decides -->
  <g transform="translate(84 84)">
    <rect x="0" y="0" width="104" height="104" rx="20" fill="url(#girl)"/>
    <rect x="120" y="0" width="104" height="104" rx="20" fill="url(#boy)"/>
    <rect x="240" y="0" width="104" height="104" rx="20" fill="url(#girl)"/>
    <rect x="0" y="120" width="104" height="104" rx="20" fill="url(#boy)"/>
    <rect x="240" y="120" width="104" height="104" rx="20" fill="url(#boy)"/>
    <rect x="0" y="240" width="104" height="104" rx="20" fill="url(#boy)"/>
    <rect x="120" y="240" width="104" height="104" rx="20" fill="url(#girl)"/>
    <rect x="240" y="240" width="104" height="104" rx="20" fill="url(#girl)"/>
    <rect x="112" y="112" width="120" height="120" rx="24" fill="url(#gold)" stroke="#fffaf0" stroke-width="6"/>
    <path transform="translate(172 176) scale(1.25)" fill="#fffdf8"
          d="M0 30 C-18 18 -34 6 -34 -10 C-34 -24 -23 -32 -13 -32 C-6 -32 -2 -28 0 -24 C2 -28 6 -32 13 -32 C23 -32 34 -24 34 -10 C34 6 18 18 0 30 Z"/>
  </g>
</svg>
